<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn more about your favorite movies by practicing trivia!">
    <meta name="author" content="Joshua Walker">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="styles/movietrivia.css" rel="stylesheet">
    <script src="movietrivia.js" defer></script>
    <title>Movie Trivia</title>
</head>
<body>
    <header>
        <p class="logo"><img src="images/logo2.png" alt="Movie Tria Logo"></p>
        <button class="menu-btn"><h3>Menu</h3></button>
        <nav class="hidden">
            <a href="index.html" class="home-link">Home</a>
            <a href="trivia.html" class="trivia-link">Trivia</a>
        </nav>
    </header>
    <main>
        <div id="hero-container">
            <img src="images/hero.png" alt="Hero Image">
        </div>
        <div class="intro">
            Search to learn more about movies or, if you're ready, <button class="play-trivia"><a href="trivia.html">PLAY TRIVIA!</a></button>
        </div>
        <div id="search-container">
            <p>Search our database</p>
            <div class="searchBar">
            <input type="text" id="searchBar" name="searchBar" placeholder='Try searching "action," "Star Wars," etc'>
            <button class="searchButton"><img src="images/searchicon.jpg" alt="search icon"></button>
            </div>
        </div>
        <div id="movie-container">

        </div>
    </main>
    <footer>
        <hr>
        <p>&copy; Movie Trivia</p>
    </footer>
</body>
</html>
